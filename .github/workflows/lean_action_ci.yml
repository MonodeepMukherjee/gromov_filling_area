name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain from lean-toolchain, fetches the Mathlib cache
      # (`lake exe cache get`), and runs `lake build` on the default target.
      - uses: leanprover/lean-action@v1
